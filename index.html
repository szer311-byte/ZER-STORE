
<footer>ZER 😈 OFFICIAL STORE © 2026</footer>

<div class="modal" id="productModal" onclick="outsideClose(event,'productModal')">
 <div class="modalbox">
  <button class="close" onclick="closeModal('productModal')">×</button>
  <div id="productDetail"></div>
 </div>
</div>

<div class="modal" id="cartModal" onclick="outsideClose(event,'cartModal')">
 <div class="modalbox">
  <button class="close" onclick="closeModal('cartModal')">×</button>
  <h2 style="color:var(--gold2)">سلة المشتريات</h2>
  <div id="cartItems"></div>
  <h3 id="cartTotal"></h3>
  <button class="goldbtn" onclick="checkout()">إتمام الطلب عبر WhatsApp</button>
 </div>
</div>

<div class="modal" id="favModal" onclick="outsideClose(event,'favModal')">
 <div class="modalbox">
  <button class="close" onclick="closeModal('favModal')">×</button>
  <h2 style="color:var(--gold2)">المفضلة ♥</h2>
  <div id="favItems"></div>
 </div>
</div>

<div id="toast"></div>

<script>
const photos=[
'photo-1521572163474-6864f9cf17ab',
'photo-1529139574466-a303027c1d8b',
'photo-1551028719-00167b16eac5',
'photo-1503342217505-b0a15ec3261c',
'photo-1515886657613-9f3515b0c78f',
'photo-1525507119028-ed4c629a60a3',
'photo-1542291026-7eec264c27ff',
'photo-1549298916-b41d501d3772',
'photo-1523275335684-37898b6baf30',
'photo-1526170375885-4d8ecf77b99f',
'photo-1490481651871-ab68de25d43d',
'photo-1551488831-00ddcb6c6bd3',
'photo-1521369909029-2afed882baee',
'photo-1584917865442-de89df76afd3',
'photo-1553062407-98eeb64c6a62',
'photo-1503341455253-b2e723bb3dbb',
'photo-1519741497674-611481863552',
'photo-1506629905607-d9c297d7b5c4',
'photo-1543163521-1bf539c55dd2',
'photo-1523398002811-999ca8dec234',
'photo-1513519245088-0e12902e5a38',
'photo-1600210492486-724fe5c67fb0',
'photo-1600607687939-ce8a6c25118c',
'photo-1616486338812-3dadae4b4ace',
'photo-1600566753086-00f18fb6b3ea',
'photo-1519238263530-99bdd11df2ea',
'photo-1503919005314-30d93d07d823',
'photo-1516627145497-ae6968895b74',
'photo-1503454537195-1dcabb73ffb9'
];

const products=[
['men','ZER Classic Tee',199,'summer',0,['S','M','L','XL']],
['men','Oversize Black',249,'summer',1,['S','M','L','XL']],
['men','Black Hoodie',349,'winter',2,['S','M','L','XL']],
['men','Urban Jacket',499,'autumn',3,['M','L','XL']],
['men','Street Style',279,'spring',4,['S','M','L','XL']],
['men','ZER Sneakers',499,'summer',6,['40','41','42','43','44']],
['men','Royal Sweatshirt',329,'winter',19,['S','M','L','XL']],
['men','Urban Cargo',299,'autumn',15,['S','M','L','XL']],

['women','ZER Women Tee',189,'summer',9,['S','M','L','XL']],
['women','Elegant Street',299,'spring',10,['S','M','L']],
['women','Red Jacket',449,'autumn',11,['S','M','L']],
['women','Winter Hoodie',329,'winter',5,['S','M','L','XL']],
['women','ZER Sneakers',459,'summer',7,['36','37','38','39','40']],
['women','Royal Bag',279,'spring',13,['مقاس واحد']],
['women','Dark Glasses',149,'summer',12,['مقاس واحد']],
['women','Premium Outfit',399,'winter',14,['S','M','L']],

['decor','ZER Wall Art',199,'spring',20,['قطعة واحدة']],
['decor','Luxury Vase',249,'summer',21,['قطعة واحدة']],
['decor','Modern Lamp',299,'autumn',22,['قطعة واحدة']],
['decor','Golden Decor',179,'winter',23,['قطعة واحدة']],
['decor','Home Sculpture',349,'spring',24,['قطعة واحدة']],
['decor','ZER Cushion',129,'summer',25,['قطعة واحدة']],
['decor','Decor Edition',229,'autumn',26,['قطعة واحدة']],

['children','Kids ZER Tee',129,'summer',27,['2-4','4-6','6-8','8-10']],
['children','Kids Hoodie',199,'winter',28,['2-4','4-6','6-8','8-10']],
['children','Kids Street Set',249,'spring',29,['2-4','4-6','6-8','8-10']],
['children','Kids Sneakers',229,'summer',6,['25','26','27','28','29']],
['children','Kids Jacket',279,'autumn',3,['2-4','4-6','6-8','8-10']],
['children','Kids Winter Set',299,'winter',5,['2-4','4-6','6-8','8-10']],
['children','Kids Cap',89,'summer',12,['مقاس واحد']]
].map((p,i)=>({
 id:i,dept:p[0],name:p[1],price:p[2],
 season:p[3],image:p[4],sizes:p[5]
}));

let season='all';
let cart=[];
let favorites=[];

try{cart=JSON.parse(localStorage.getItem('zerCart')||'[]')}catch(e){}
try{favorites=JSON.parse(localStorage.getItem('zerFavorites')||'[]')}catch(e){}

function photo(p){
 return 'https://images.unsplash.com/'+photos[p.image]+'?auto=format&fit=crop&w=500&q=85';
}
function save(){
 try{
  localStorage.setItem('zerCart',JSON.stringify(cart));
  localStorage.setItem('zerFavorites',JSON.stringify(favorites));
 }catch(e){}
 updateCounts();
}
function updateCounts(){
 document.getElementById('cartCount').textContent=cart.reduce((s,p)=>s+p.qty,0);
 document.getElementById('favCount').textContent=favorites.length;
}
function toast(msg){
 const el=document.getElementById('toast');
 el.textContent=msg;el.style.display='block';
 setTimeout(()=>el.style.display='none',2200);
}
function setSeason(value,btn){
 season=value;
 document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
 btn.classList.add('active');render();
}
function render(){
 const search=document.getElementById('search').value.trim().toLowerCase();
 const sort=document.getElementById('sort').value;
 ['men','women','decor','children'].forEach(dept=>{
  let list=products.filter(p=>p.dept===dept&&
   (season==='all'||p.season===season)&&
   p.name.toLowerCase().includes(search));
  if(sort==='low')list.sort((a,b)=>a.price-b.price);
  if(sort==='high')list.sort((a,b)=>b.price-a.price);
  const shelf=document.getElementById(dept+'Shelf');
  shelf.innerHTML=list.length?list.map(p=>`
   <article class="product">
    <div class="pic" role="button" tabindex="0"
     onclick="showProduct(${p.id})"
     onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();showProduct(${p.id})}">
     <img src="${photo(p)}" alt="${p.name}" loading="lazy"
      onerror="this.src='https://placehold.co/500x600/171313/D8BD7A?text=ZER'">
     <span class="tag">ZER</span>
    </div>
    <div class="pinfo">
     <h4>${p.name}</h4>
     <div class="price">${p.price} DH</div>
     <div class="actions">
      <button class="goldbtn" onclick="quickAdd(${p.id})">أضف للسلة</button>
      <button class="ghost" onclick="toggleFavorite(${p.id})">♥</button>
     </div>
    </div>
   </article>`).join(''):'<p class="empty">لا توجد منتجات في هذا القسم بهذا الاختيار.</p>';
 });
}
function showProduct(id){
 const p=products[id];
 document.getElementById('productDetail').innerHTML=`
 <div class="detail">
  <img src="${photo(p)}" alt="${p.name}" onerror="this.src='https://placehold.co/500x600/171313/D8BD7A?text=ZER'">
  <div>
   <h2>${p.name}</h2>
   <h3 class="price">${p.price} DH</h3>
   <p>منتج من مجموعة ZER. اختار المقاس المناسب قبل الإضافة للسلة.</p>
   <label>المقاس</label>
   <select id="productSize">${p.sizes.map(s=>`<option>${s}</option>`).join('')}</select>
   <button class="goldbtn" style="width:100%;margin-top:12px" onclick="addToCart(${id})">أضف إلى السلة</button>
   <button class="ghost" style="width:100%;margin-top:8px" onclick="toggleFavorite(${id})">أضف للمفضلة ♥</button>
  </div>
 </div>`;
 document.getElementById('productModal').classList.add('show');
}
function quickAdd(id){
 const p=products[id];
 addItem(p,p.sizes[0]);
}
function addToCart(id){
 const p=products[id];
 const size=document.getElementById('productSize').value;
 addItem(p,size);
 closeModal('productModal');
}
function addItem(p,size){
 const existing=cart.find(x=>x.id===p.id&&x.size===size);
 if(existing)existing.qty++;
 else cart.push({id:p.id,size,qty:1});
 save();toast('تزاد المنتج للسلة');
}
function toggleFavorite(id){
 const i=favorites.indexOf(id);
 if(i>=0)favorites.splice(i,1);
 else favorites.push(id);
 save();toast(i>=0?'تحيد من المفضلة':'تزاد للمفضلة');
}
function openCart(){
 renderCart();
 document.getElementById('cartModal').classList.add('show');
}
function renderCart(){
 const box=document.getElementById('cartItems');
 if(!cart.length){box.innerHTML='<p>السلة فارغة حالياً.</p>';document.getElementById('cartTotal').textContent='المجموع: 0 DH';return}
 box.innerHTML=cart.map((item,i)=>{
  const p=products[item.id];
  return `<div class="cartrow">
   <div><b>${p.name}</b><br><small>${item.size} — ${p.price} DH</small></div>
   <div class="qty">
    <button onclick="changeQty(${i},-1)">−</button>
    ${item.qty}
    <button onclick="changeQty(${i},1)">+</button>
    <button onclick="removeCart(${i})">حذف</button>
   </div>
  </div>`;
 }).join('');
 const total=cart.reduce((s,item)=>s+products[item.id].price*item.qty,0);
 document.getElementById('cartTotal').textContent='المجموع: '+total+' DH';
}
function changeQty(i,n){
 cart[i].qty+=n;
 if(cart[i].qty<=0)cart.splice(i,1);
 save();renderCart();
}
function removeCart(i){cart.splice(i,1);save();renderCart()}
function showFavorites(){
 const box=document.getElementById('favItems');
 const list=favorites.map(id=>products[id]);
 box.innerHTML=list.length?list.map(p=>`
 <div class="cartrow">
  <span>${p.name} — ${p.price} DH</span>
  <button onclick="showProduct(${p.id});closeModal('favModal')">عرض المنتج</button>
 </div>`).join(''):'<p>مازال ما ضفتي حتى منتج للمفضلة.</p>';
 document.getElementById('favModal').classList.add('show');
}
function checkout(){
 if(!cart.length){toast('السلة فارغة');return}
 let message='السلام عليكم، بغيت نأكد هاد الطلب من ZER:%0A';
 cart.forEach(item=>{
  const p=products[item.id];
  message+=`%0A${p.name} | المقاس: ${item.size} | الكمية: ${item.qty} | ${p.price*item.qty} DH`;
 });
 const total=cart.reduce((s,item)=>s+products[item.id].price*item.qty,0);
 message+=`%0Aالمجموع: ${total} DH`;
 window.open('https://wa.me/?text='+message,'_blank');
}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function outsideClose(event,id){if(event.target.id===id)closeModal(id)}

document.getElementById('audioFile').addEventListener('change',function(){
 const file=this.files[0];
 if(!file)return;
 const player=document.getElementById('player');
 if(player.dataset.url)URL.revokeObjectURL(player.dataset.url);
 const url=URL.createObjectURL(file);
 player.dataset.url=url;
 player.src=url;player.play().catch(()=>{});
});

document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){
  document.querySelectorAll('.modal.show').forEach(m=>m.classList.remove('show'));
 }
});

updateCounts();
render();
</script>
</body>
</html>
